name: "Sync Upstream & Releases"

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync-upstream-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      UPSTREAM_GIT_URL: "https://github.com/artemnovitckii/claude-animation-skills.git"
      UPSTREAM_API_URL: "https://api.github.com/repos/artemnovitckii/claude-animation-skills"
      UPSTREAM_BRANCH: "main"
      UPSTREAM_RELEASE_QUERY: per_page=10

    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync default branch and all tags
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "$UPSTREAM_GIT_URL" || git remote set-url upstream "$UPSTREAM_GIT_URL"
          git fetch upstream --tags "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/upstream/${UPSTREAM_BRANCH}"
          git fetch origin "+refs/heads/${UPSTREAM_BRANCH}:refs/remotes/origin/${UPSTREAM_BRANCH}"
          git checkout -B "$UPSTREAM_BRANCH" "refs/remotes/origin/${UPSTREAM_BRANCH}"
          git merge --no-edit "refs/remotes/upstream/${UPSTREAM_BRANCH}"
          git push origin "HEAD:refs/heads/${UPSTREAM_BRANCH}"
          if git for-each-ref --format='%(refname)' refs/tags/ | grep -q .; then
            git push origin 'refs/tags/*:refs/tags/*'
          else
            echo "No upstream tags to push."
          fi
          echo "Default branch and tags synchronized."

      - name: Get latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl_args=(-fsSL -H "Accept: application/json" -H "User-Agent: GitHub-Actions-sync")
          if [[ "$UPSTREAM_API_URL" == https://api.github.com/* ]]; then
            curl_args+=(-H "Authorization: Bearer $GH_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28")
          fi
          curl "${curl_args[@]}" "${UPSTREAM_API_URL}/releases?${UPSTREAM_RELEASE_QUERY}" -o releases.json
          jq '[.[] | select(.draft != true)] | .[0] // {}' releases.json > release.json
          TAG=$(jq -r '.tag_name // empty' release.json)
          if [[ -z "$TAG" || "$TAG" == "null" ]]; then
            echo "No published upstream release found; source and tags are still synced."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TITLE=$(jq -r '.name // .tag_name' release.json)
          PRERELEASE=$(jq -r 'if .prerelease == true then "true" else "false" end' release.json)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "title=$TITLE" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "found=true" >> "$GITHUB_OUTPUT"
          jq -r '.body // "synced from upstream release."' release.json > release-notes.md

      - name: Download upstream release assets
        if: steps.release.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          jq -r '.assets[]? | [.name, .browser_download_url] | @tsv' release.json > assets.tsv
          while IFS=$'\t' read -r NAME URL; do
            [[ -z "${NAME:-}" || -z "${URL:-}" ]] && continue
            echo "Downloading: $NAME"
            curl -fL --retry 3 --retry-all-errors "$URL" -o "assets/$NAME"
          done < assets.tsv

      - name: Generate SHA256 checksums
        if: steps.release.outputs.found == 'true'
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          FILES=(assets/*)
          if (( ${#FILES[@]} > 0 )); then
            # Exclude any upstream checksum with the same name and avoid hashing this file itself.
            (
              cd assets
              find . -maxdepth 1 -type f ! -name 'SHA256SUMS.txt' -print0 \
                | sort -z \
                | xargs -0 -r sha256sum
            ) > SHA256SUMS.txt
            mv SHA256SUMS.txt assets/SHA256SUMS.txt
            echo "SHA256SUMS.txt generated."
            {
              echo '### SHA-256 checksums'
              echo '```text'
              cat assets/SHA256SUMS.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No release assets to checksum."
          fi

      - name: Publish synced release
        if: steps.release.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          TITLE: ${{ steps.release.outputs.title }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            if [[ "$PRERELEASE" == "true" ]]; then
              gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes-file release-notes.md --prerelease --verify-tag
            else
              gh release create "$TAG" --repo "$REPO" --title "$TITLE" --notes-file release-notes.md --verify-tag
            fi
          fi
          shopt -s nullglob
          ASSETS=(assets/*)
          if (( ${#ASSETS[@]} > 0 )); then
            gh release upload "$TAG" "${ASSETS[@]}" --repo "$REPO" --clobber
          else
            echo "No release assets to upload."
          fi
          echo "Release publishing completed: $TAG"
